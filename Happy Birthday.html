<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Aref+Ruqaa:wght@400;700&family=Poppins:wght@700&family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--pink:#ff5fa8;--paper:#fffaf5;--ink:#b84d78;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Poppins',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .6s}
.scr.on{opacity:1;pointer-events:auto}
.word{font-size:clamp(44px,14vw,90px);color:var(--pink);text-shadow:0 0 24px #ff5fa8aa}
.pop{animation:pop .9s ease both}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.fl{transform-box:fill-box;transform-origin:center;animation:bloom 1.3s cubic-bezier(.2,1.5,.4,1) both}
.stem{opacity:0;animation:fadeIn .6s .1s both}
@keyframes bloom{0%{transform:scale(0) rotate(-60deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fadeIn{to{opacity:1}}
#bq{filter:drop-shadow(0 0 18px #ff5fa860)}
#ball canvas{position:absolute;inset:0;width:100%;height:100%}
.tapt{font-family:'Dancing Script',cursive;color:#c2455e;font-size:21px;margin-top:40px;transition:opacity .4s}
.cat{font-size:90px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.hb{font-size:clamp(26px,9vw,44px);letter-spacing:2px}
.hb span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.hint{color:#ffffffaa;font-size:13px;font-weight:700;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.msg{width:min(88vw,420px);background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 20px;box-sizing:border-box;font-family:'Aref Ruqaa','Dancing Script',serif;font-size:24px;direction:rtl;line-height:1.6;text-align:center;min-height:64px;box-shadow:0 0 30px #ff5fa840}
.pics{display:flex;width:min(88vw,420px);border:2px solid #ffffffcc;border-radius:4px;overflow:hidden;box-shadow:0 0 30px #ff5fa840}
.pic{flex:1;aspect-ratio:3/4;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:54px}
.heart{position:relative;width:0;height:0;transform-style:preserve-3d}
.heart div{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:2px solid #fff;border-radius:4px;background-size:cover;background-position:center;box-shadow:0 0 12px #ff5fa8;display:flex;align-items:center;justify-content:center;font-size:22px}
.book{--w:min(44vw,210px);position:relative;width:var(--w);aspect-ratio:3/4;perspective:1200px;transition:transform 1s}
.book.open{transform:translateX(calc(var(--w)/2))}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s}
.leaf.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:44px;border:2px solid #ffffffcc;box-sizing:border-box;box-shadow:0 0 30px #ff5fa840}
.face.back{transform:rotateY(180deg)}
.cover{background:var(--paper)!important;font-size:64px}
#bloom{will-change:opacity;position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;display:none;transition:opacity 1.3s ease}
.env{position:relative;width:240px;height:160px;cursor:pointer;perspective:700px;animation:fl 3.4s ease-in-out infinite}
.env.open{animation-play-state:paused}
.env .back{box-shadow:0 18px 26px rgba(60,30,20,.28)}
@keyframes fl{50%{transform:translateY(-7px)}}
.env .back{position:absolute;inset:0;background:#c9b48f;border-radius:10px}
.env .paper{position:absolute;left:14px;right:14px;top:18px;height:120px;background:#fff6f3;border-radius:6px;color:#7a5a4a;font-size:11px;padding:14px;transition:transform 1s cubic-bezier(.22,.8,.3,1) .45s;font-weight:700;letter-spacing:1px;direction:ltr;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.env .front{position:absolute;inset:0;background:linear-gradient(135deg,#e6d7b8,#d3c09a);border-radius:10px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:90px;background:#dccaa6;border-radius:10px 10px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .85s cubic-bezier(.65,0,.25,1),z-index 0s .4s;z-index:2}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .paper{animation:pp 1.8s cubic-bezier(.4,0,.2,1) .45s forwards}
@keyframes pp{0%{transform:none;z-index:0}45%{transform:translateY(-130px);z-index:0}46%{transform:translateY(-130px);z-index:3}100%{transform:translateY(-48px) scale(1.16);z-index:3}}
#s1 .hint{color:#8b7468;animation:none;font-family:Cairo,sans-serif;font-size:14px;margin:0}
.names{font-size:30px;font-weight:800;margin:6px 0 0;color:#4a2a30;font-family:Cairo,Poppins,sans-serif}
#go{background:var(--pink);color:#fff;border:0;border-radius:30px;padding:14px 34px;font:700 18px 'Poppins',sans-serif;box-shadow:0 0 30px #ff5fa8aa}
#word{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="word" class="word"></div>

<div class="scr on" id="s0"><button id="go">Tap to start ♥</button></div>
<div class="scr" id="s1" style="background:#efe5d3"><div class="env" id="env"><div class="back"></div><div class="paper" id="ptxt"></div><div class="front"></div><div class="flap"></div></div><div class="names" id="names"></div><p class="hint">اضغط على الظرف لفتحه</p></div>
<div class="scr" id="s3"><div class="msg" id="msg" style="visibility:hidden">&nbsp;</div><div class="book" id="book"></div><div class="hint">tap or swipe to flip the page</div></div>
<div class="scr" id="s4"><div class="heart" id="heart"></div></div>

const cv=$('c'), ctx=cv.getContext('2d'); let W,H,mode='stars',stars=[],drops=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6}));drops=Array.from({length:Math.ceil(W/14)},()=>Math.random()*-50)}

    ctx.fillStyle='#050816';ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1;
  }

}

const PAL=[["#fff3f0","#f6c9d1","#e88da1"],["#fff7ee","#f8dccb","#eeaa96"],["#f9bccb","#e87b94","#bf3a56"],["#e0526a","#b82c47","#821f34"],["#f4cde0","#da92b9","#a95582"],["#fdeedd","#f3d2b6","#e5a98a"]];
let SP=null;const SZ=220;
function makeSprites(){
  SP=[];
  PAL.forEach(pal=>{for(let v=0;v<2;v++){
    const c=document.createElement('canvas');c.width=c.height=SZ;const g=c.getContext('2d');
    g.translate(SZ/2,SZ/2);const r=100;
    [[8,1,pal[0]],[7,.78,pal[1]],[6,.55,pal[2]],[5,.3,pal[1]]].forEach((q,ri)=>{
      for(let i=0;i<q[0];i++){g.save();g.rotate(i/q[0]*6.283+ri*.5+v*.4);
        g.beginPath();g.ellipse(0,-r*q[1]*.55,r*q[1]*.42,r*q[1]*.55,0,0,6.283);
        g.fillStyle=q[2];g.fill();g.strokeStyle='rgba(120,30,50,.2)';g.lineWidth=1.2;g.stroke();g.restore()}
    });
    g.beginPath();g.arc(0,0,r*.12,0,6.283);g.fillStyle=pal[2];g.fill();SP.push(c)}});
}
function bloom(env){
  return new Promise(res=>{
    if(!SP)makeSprites();
    const bc=$('bloom'),bx=bc.getContext('2d');
    const W=bc.width=innerWidth,H=bc.height=innerHeight;
    const rc=env.getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2;
    const N=Math.max(110,Math.min(240,Math.round(W*H/2600))),F=[],maxD=Math.hypot(W,H);
    for(let i=0;i<N;i++){
      const tx=Math.random()*W*1.1-W*.05,ty=Math.random()*H*1.1-H*.05,d=Math.hypot(tx-cx,ty-cy)/maxD;
      F.push({tx,ty,k:(42+Math.random()*48)/100,rot:Math.random()*6.283,sp:Math.floor(Math.random()*SP.length),dl:d*1.5+Math.random()*.2,dur:1.1+Math.random()*.4});
    }
    F.sort((a,b)=>a.dl-b.dl);
    bc.style.transition='none';bc.style.opacity=1;bc.style.display='block';
    let t0=null,done=false;
    function fr(now){
      if(t0===null)t0=now;
      const e=(now-t0)/1000;
      bx.setTransform(1,0,0,1,0,0);bx.globalAlpha=1;bx.clearRect(0,0,W,H);
      const a=Math.max(0,Math.min(1,(e-.8)/1.6));bx.fillStyle='rgba(240,176,190,'+(a*a*(3-2*a))+')';bx.fillRect(0,0,W,H);
      for(const f of F){
        let t=(e-f.dl)/f.dur;if(t<=0)continue;if(t>1)t=1;
        const m=1-Math.pow(1-t,4),sc=f.k*(.05+.95*(1-Math.pow(1-t,3))),rt=f.rot+(1-t)*.9,co=Math.cos(rt)*sc,si=Math.sin(rt)*sc;
        bx.globalAlpha=Math.min(1,t*4);
        bx.setTransform(co,si,-si,co,cx+(f.tx-cx)*m,cy+(f.ty-cy)*m);
        bx.drawImage(SP[f.sp],-SZ/2,-SZ/2);
      }
      if(e>3.3&&!done){done=true;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{bc.style.transition='opacity 1.5s ease';bc.style.opacity=0;setTimeout(()=>{bc.style.display='none'},1700)}));
        res()}
      if(e<5.2)requestAnimationFrame(fr);
    }
    requestAnimationFrame(fr);
  });
}
async function run(){
  show('');mode='rain';
  const w=$('word');
  for(const x of ['3','2','1','HAPPY','BIRTHDAY','TO',NAME]){w.textContent=x;w.className='word';void w.offsetWidth;w.className='word pop';await sleep(1000)}
  w.textContent='';mode='stars';
  mode='off';$('names').textContent=NAME;$('ptxt').textContent='HAPPY BIRTHDAY '+NAME.toUpperCase();
  const env=$('env');show('s1');
  await new Promise(r=>{env.onclick=r});
  env.classList.add('open');await sleep(500);
  await bloom(env);
  mode='stars';show('s3');
  const n=MESSAGES.length,bk=$('book'),leaves=[];
  const face=(c,src,k)=>{const d=document.createElement('div');d.className='face '+c;bg(d,src,k);return d};
  for(let k=0;k<=n;k++){
    const l=document.createElement('div');l.className='leaf';l.style.zIndex=100-k;
    if(k===0){const f=document.createElement('div');f.className='face front cover';f.textContent='🫶';l.appendChild(f)}
    else l.appendChild(face('front',MESSAGES[k-1].pics[1],k*2));
    if(k<n)l.appendChild(face('back',MESSAGES[k].pics[0],k*2+1));
    bk.appendChild(l);leaves.push(l);
  }
  await tap();
  $('msg').style.visibility='visible';
  for(let i=0;i<n;i++){
    bk.classList.add('open');
    leaves[i].classList.add('flip');setTimeout(()=>{leaves[i].style.zIndex=i+1},500);
    await type($('msg'),MESSAGES[i].text);await tap();
  }
  const h=$('heart'),N=Math.max(HEART_PHOTOS.length,36),s=Math.min(innerWidth/40,9);
  for(let i=0;i<N;i++){
    const t=i/N*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    const d=document.createElement('div');bg(d,HEART_PHOTOS.length?HEART_PHOTOS[i%HEART_PHOTOS.length]:'',i);
    d._f=`translate3d(${x*s}px,${y*s}px,${(Math.random()-.5)*60}px) rotateZ(${(Math.random()-.5)*30}deg)`;
    d.style.opacity=0;d.style.transform='translate3d(0,0,-300px) scale(.2)';d.style.transition='opacity .7s,transform 1s';d.style.transitionDelay=i*130+'ms';h.appendChild(d);
  }
  show('s4');void h.offsetWidth;[...h.children].forEach(d=>{d.style.opacity=1;d.style.transform=d._f});

}
$('go').onclick=e=>{e.stopPropagation();run()};
</script>
</body>
